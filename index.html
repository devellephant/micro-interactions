<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro interactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<style>
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 1400px;
    margin: 0 auto;
    padding: clamp(32px, 6vw, 72px) clamp(16px, 3vw, 32px) clamp(24px, 4vw, 40px);
  }
  h1 {
    margin: 0;
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  header p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
    max-width: 52ch;
  }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 clamp(16px, 3vw, 32px) 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: clamp(12px, 1.6vw, 20px);
  }
  figure { margin: 0; }
  .frame {
    aspect-ratio: var(--cell-ratio);
    border-radius: var(--cell-radius);
    overflow: hidden;
    background: var(--cell);
  }
  .frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
  }
  figcaption {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 10px 4px 0;
    font-size: 14px;
  }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  figcaption a { color: var(--ink); text-decoration: none; font-weight: 500; }
  figcaption a:hover { text-decoration: underline; text-underline-offset: 3px; }
  figcaption a:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 2px; }
  time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Micro interactions</h1>
  <p id="intro">One small, carefully tuned interaction a day.</p>
</header>
<main id="grid"></main>

<script src="manifest.js"></script>
<script>
  const grid = document.getElementById('grid');
  const items = [...window.MANIFEST].reverse(); // newest first

  document.getElementById('intro').textContent =
    `One small, carefully tuned interaction a day. ${items.length} so far.`;

  for (const item of items) {
    const href = `interactions/${item.slug}/`;
    const fig = document.createElement('figure');
    fig.innerHTML = `
      <div class="frame">
        <iframe src="${href}index.html" loading="lazy" title="${item.title}"></iframe>
      </div>
      <figcaption>
        <span class="num">${item.id}</span>
        <a href="${href}index.html" title="${item.note ?? ''}">${item.title}</a>
        <time datetime="${item.date}">${item.date}</time>
      </figcaption>`;
    grid.appendChild(fig);
  }
</script>
</body>
</html>
