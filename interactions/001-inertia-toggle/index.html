<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>001 Inertia toggle</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
  /* The stage never moves, so it is a stable reference for pointer math,
     and the shadows sit on it like on a table under the plate. */
  .stage {
    position: relative;
    display: grid;
  }
  .shadow {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #000;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }
  /* Fixed blurs; only transform and opacity change per frame. */
  .shadow.ambient { filter: blur(12px); }
  .shadow.contact { filter: blur(2.5px); inset: 3px 6px; }
  .switch {
    --w: 160px;
    --h: 80px;
    --pad: 6px;
    position: relative;
    width: var(--w);
    height: var(--h);
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--track-off);
    cursor: grab;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 1px 2px rgb(0 0 0 / .12);
    /* The switch is a plate on a center pivot: pressing one side of it
       pushes that side into the screen. Kept flat (no preserve-3d) so the
       tilted plate can never cut through the knob; the knob's height is
       faked with a small parallax shift in JS instead. */
    will-change: transform;
  }
  /* Light on the tilted plate: the side pushed away darkens, the side
     coming toward you catches a little light. Set from JS. */
  .switch::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--shade, none);
    pointer-events: none;
  }
  .switch:active { cursor: grabbing; }
  .switch:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 5px;
  }
  .knob {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    width: calc(var(--h) - 2 * var(--pad));
    height: calc(var(--h) - 2 * var(--pad));
    border-radius: 50%;
    background: var(--knob);
    box-shadow:
      0 1px 1px rgb(0 0 0 / .14),
      0 4px 10px rgb(0 0 0 / .10);
    will-change: transform;
    pointer-events: none;
  }
</style>
</head>
<body class="piece">

<div class="stage">
  <span class="shadow ambient" aria-hidden="true"></span>
  <span class="shadow contact" aria-hidden="true"></span>
  <button class="switch" role="switch" aria-checked="false" aria-label="Inertia toggle">
    <span class="knob"></span>
  </button>
</div>

<script>
(() => {
  const sw = document.querySelector('.switch');
  const knob = sw.querySelector('.knob');
  const stage = document.querySelector('.stage');
  const ambient = stage.querySelector('.ambient');
  const contact = stage.querySelector('.contact');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const dark = matchMedia('(prefers-color-scheme: dark)');

  // Geometry (px), read from CSS so the numbers live in one place.
  let W, H, PAD, K, TRAVEL;
  function measure() {
    const cs = getComputedStyle(sw);
    W = parseFloat(cs.width);
    H = parseFloat(cs.height);
    PAD = parseFloat(cs.getPropertyValue('--pad'));
    K = H - 2 * PAD;          // knob diameter
    TRAVEL = W - 2 * PAD - K; // distance the knob can move
  }

  // Track colors, re-read when the color scheme changes.
  let offRGB, onRGB;
  function readColors() {
    const root = getComputedStyle(document.documentElement);
    offRGB = hex(root.getPropertyValue('--track-off'));
    onRGB = hex(root.getPropertyValue('--signal'));
  }
  function hex(s) {
    s = s.trim().replace('#', '');
    if (s.length === 3) s = [...s].map(c => c + c).join('');
    const n = parseInt(s, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // Physical state.
  let x = 0, v = 0;          // knob position and velocity (px, px/s)
  let on = false;
  let target = 0;
  let press = 0, pressV = 0; // 0 = released, 1 = held (springs too)
  let rx = 0, rxV = 0;       // plate tilt (deg) around X and Y, and their
  let ry = 0, ryV = 0;       // angular velocities

  // Pointer state.
  let dragging = false, moved = false;
  let startPointer = 0, startX = 0;
  let ptrX = 0, ptrY = 0;    // pointer relative to the plate center, -1..1 at the edges

  // How far the plate tilts (deg). A press at the very edge reaches about
  // 3/4 of this; dragging beyond the plate keeps leaning in, then saturates.
  const TILT_Y = 20;  // pressing left/right
  const TILT_X = 22;  // pressing top/bottom (the plate is short, so more angle)
  const KICK = 42;    // knob slamming into an end: deg per knob-diameter of overshoot

  function readPointer(e) {
    // The stage is never transformed, so this ignores the plate's own tilt.
    const r = stage.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    ptrX = (e.clientX - cx) / (W / 2);
    ptrY = (e.clientY - cy) / (H / 2);
  }

  // Springs. Released: underdamped, so momentum shows as overshoot.
  // Dragging: stiffer and close to critical, so the knob trails the
  // finger a little. That lag is what makes it feel heavy.
  function spring() {
    if (reduceMotion.matches) return { k: 700, c: 2 * Math.sqrt(700) };
    if (dragging) return { k: 900, c: 2 * Math.sqrt(900) * 0.8 };
    return { k: 420, c: 2 * Math.sqrt(420) * 0.42 };
  }

  // Past the ends the drag resists with growing force.
  function rubber(d) {
    const limit = 22;
    return limit * (1 - Math.exp(-d / (limit * 1.6)));
  }

  function setOn(next) {
    on = next;
    target = on ? TRAVEL : 0;
    sw.setAttribute('aria-checked', String(on));
  }

  // Simulation loop. Runs only while something is moving.
  let raf = 0, last = 0;
  function wake() {
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    const steps = 4, h = dt / steps;
    const { k, c } = spring();
    const calm = reduceMotion.matches;
    // Plate: follows the finger while held, heavy and close to critical;
    // let go, it rocks back on a looser spring.
    const tk = dragging ? 380 : 230;
    const tc = 2 * Math.sqrt(tk) * (calm ? 1 : dragging ? 0.75 : 0.36);
    const amt = calm ? 0.35 : 1;
    for (let i = 0; i < steps; i++) {
      v += (-k * (x - target) - c * v) * h;
      x += v * h;
      const pk = 600, pc = 2 * Math.sqrt(pk) * 0.7;
      pressV += (-pk * (press - (dragging ? 1 : 0)) - pc * pressV) * h;
      press += pressV * h;

      // When the knob overshoots an end, its momentum shoves that end of
      // the plate into the screen. The overshoot is itself a spring, so
      // the shove arrives and leaves with the knob's own timing.
      const over = x > TRAVEL ? x - TRAVEL : x < 0 ? x : 0;
      const kick = calm ? 0 : Math.max(-0.5, Math.min(0.5, over / K)) * KICK;
      const ty = (dragging ? Math.tanh(ptrX) * TILT_Y * amt : 0) + kick;
      const tx = dragging ? -Math.tanh(ptrY) * TILT_X * amt : 0;
      ryV += (-tk * (ry - ty) - tc * ryV) * h;
      ry += ryV * h;
      rxV += (-tk * (rx - tx) - tc * rxV) * h;
      rx += rxV * h;
    }
    render();
    const atRest = !dragging && Math.abs(v) < 0.5 && Math.abs(x - target) < 0.05
      && Math.abs(press) < 0.002 && Math.abs(pressV) < 0.01
      && Math.abs(rx) < 0.02 && Math.abs(ry) < 0.02
      && Math.abs(rxV) < 0.05 && Math.abs(ryV) < 0.05;
    if (atRest) {
      x = target; v = 0; press = 0; pressV = 0;
      rx = ry = rxV = ryV = 0;
      render();
      raf = 0;
      return;
    }
    raf = requestAnimationFrame(tick);
  }

  function render() {
    const over = x > TRAVEL ? x - TRAVEL : x < 0 ? x : 0;
    const base = Math.min(Math.max(x, 0), TRAVEL);
    let sx, sy, origin;

    if (over !== 0) {
      // Hitting an end: flatten against it, bulge vertically (keeps volume).
      const s = Math.min(Math.abs(over) / K, 0.45);
      sx = 1 - s * 0.75;
      sy = 1 + s * 0.4;
      origin = over > 0 ? 'right center' : 'left center';
    } else {
      // Moving fast: stretch along the direction of travel.
      const st = Math.min(Math.abs(v) / 2400, 1) * 0.16;
      sx = 1 + st;
      sy = 1 - st * 0.55;
      origin = 'center';
    }

    const p = 1 - press * 0.05; // a slight give while held
    knob.style.transformOrigin = origin;
    // The knob sits above the plate, so as the plate tilts it slides a
    // little toward the side coming at you (pressed flatter while held).
    const lift = 8 - press * 4;
    const deg = Math.PI / 180;
    const px = lift * Math.sin(ry * deg), py = -lift * Math.sin(rx * deg);
    knob.style.transform =
      `translate(${base + px}px, ${py}px) scale(${sx * p}, ${sy * p})`;

    // The plate sinks under the finger and tilts toward where it pushes.
    sw.style.transform =
      `perspective(420px) translateZ(${-press * 12}px) rotateX(${rx}deg) rotateY(${ry}deg)`;

    // Shadows carry most of the depth. Light comes from above, a touch in
    // front, so shadows fall down. The plate's height over the
    // stage (`elev`): 1 at rest, low when pushed in.
    const d = dark.matches ? 2.6 : 1;
    const elev = 1 - Math.min(Math.max(press, 0), 1.2) * 0.8;
    // A side pushed away is lower, so its shadow tucks in, while the
    // raised side throws its shadow out. Net: the shadow slides toward
    // the raised side.
    const shx = -ry * 0.9, shy = rx * 0.7;
    ambient.style.opacity = Math.min(0.2 * d * (0.55 + 0.45 * elev), 0.8);
    ambient.style.transform =
      `translate(${shx * elev}px, ${4 + 9 * elev + shy * elev}px) scale(${0.9 + 0.08 * elev}, ${0.84 + 0.12 * elev})`;
    // The contact shadow is where the plate nearly touches: darkest when
    // pushed in, and darker still on whichever end is pushed deepest.
    contact.style.opacity = Math.min(0.1 * d * (1.9 - 0.9 * elev), 0.8);
    contact.style.transform =
      `translate(${shx * 0.3}px, ${1 + 2.5 * elev + shy * 0.3}px) scale(${1 - 0.04 * elev})`;

    // Knob shadow: it floats `lift` px over the plate. When pressed it
    // comes down, so its shadow tightens; on a tilt the shadow trails the
    // parallax shift.
    const ka = dark.matches ? 0.42 : 0.12;
    knob.style.boxShadow =
      `${-px * 0.5}px ${0.5 + lift * 0.08 - py * 0.5}px ${1 + lift * 0.1}px rgb(0 0 0 / ${(ka * 1.3).toFixed(3)}),` +
      `${-px * 1.2}px ${lift * 0.55 - py * 1.2}px ${lift * 1.5}px rgb(0 0 0 / ${ka.toFixed(3)})`;
    sw.style.setProperty('--shade', shade(ry, 'to right') + ',' + shade(-rx, 'to bottom'));

    // Track color follows the knob, with a little easing so the
    // color commits before the knob arrives.
    const t = Math.min(Math.max(x / TRAVEL, 0), 1);
    const e = t * t * (3 - 2 * t);
    const rgb = offRGB.map((a, i) => Math.round(a + (onRGB[i] - a) * e));
    sw.style.background = `rgb(${rgb.join(',')})`;
  }

  // A positive angle means the far end of `dir` is pushed away from you.
  function shade(deg, dir) {
    const a = Math.min(Math.abs(deg) * 0.011, 0.2);
    if (a < 0.002) return `linear-gradient(${dir}, transparent, transparent)`;
    const away = `rgb(0 0 0 / ${a.toFixed(3)})`;
    const near = `rgb(255 255 255 / ${(a * 0.6).toFixed(3)})`;
    const [from, to] = deg > 0 ? [near, away] : [away, near];
    return `linear-gradient(${dir}, ${from}, transparent 50%, ${to})`;
  }

  // Pointer input.
  let samples = [];
  sw.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    sw.setPointerCapture(e.pointerId);
    readPointer(e);
    dragging = true;
    moved = false;
    startPointer = e.clientX;
    startX = target; // drag relative to where the knob is headed
    samples = [{ t: e.timeStamp, x: e.clientX }];
    wake();
  });

  sw.addEventListener('pointermove', e => {
    if (!dragging) return;
    readPointer(e);
    const dx = e.clientX - startPointer;
    if (Math.abs(dx) > 3) moved = true;
    let raw = startX + dx;
    if (raw > TRAVEL) raw = TRAVEL + rubber(raw - TRAVEL);
    else if (raw < 0) raw = -rubber(-raw);
    target = raw;
    samples.push({ t: e.timeStamp, x: e.clientX });
    if (samples.length > 6) samples.shift();
    wake();
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      // A tap: toggle, and give the knob a push off the start.
      setOn(!on);
      v += (on ? 1 : -1) * 120;
    } else {
      // A flick: the pointer's release speed carries into the knob.
      const a = samples[0], b = samples[samples.length - 1];
      const dt = (b.t - a.t) / 1000;
      const flick = dt > 0 && (e.timeStamp - b.t) < 80 ? (b.x - a.x) / dt : 0;
      v = v * 0.5 + flick * 0.6;
      const projected = x + v * 0.12;
      setOn(projected > TRAVEL / 2);
    }
    wake();
  }
  sw.addEventListener('pointerup', release);
  sw.addEventListener('pointercancel', release);

  // Keyboard (Space / Enter on a button fires click with detail 0).
  sw.addEventListener('click', e => {
    if (e.detail !== 0) return; // pointer clicks are handled above
    setOn(!on);
    v += (on ? 1 : -1) * 120;
    pressV += 9; // a key press is a push too: a brief dip
    wake();
  });
  sw.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' && !on) { setOn(true); pressV += 9; wake(); }
    if (e.key === 'ArrowLeft' && on) { setOn(false); pressV += 9; wake(); }
  });

  dark.addEventListener('change', () => { readColors(); render(); });
  addEventListener('resize', () => { measure(); target = on ? TRAVEL : 0; x = target; render(); });

  measure();
  readColors();
  render();
})();
</script>
</body>
</html>
